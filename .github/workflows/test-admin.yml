name: Testar painel administrativo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/painel-admin-seguro]
permissions:
  contents: read
jobs:
  admin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
      - name: Executar testes Node.js
        run: node --test tests/admin.test.js
